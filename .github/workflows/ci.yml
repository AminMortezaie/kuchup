name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Role propagator tests
        run: go test ./role_propagator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests and coverage
        run: ./scripts/run_ci_tests.sh

  deploy-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck EC2 deploy scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x scripts/ec2_app_deploy.sh scripts/ec2_redis.sh
      - name: Deploy check (local, no SSH)
        run: ./scripts/ec2_app_deploy.sh check --local
