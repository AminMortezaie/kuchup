# Production deploy via ./scripts/ec2_app_deploy.sh run on a self-hosted runner
# that lives on the same EC2 box as kuchup.com.
#
# The runner is on-box, so Docker builds use the EC2's own BuildKit cache and
# credentials are read from the server's gitignored aws-postgres.env / .env
# (no GitHub secrets required).  No hairpin SSH to an Elastic IP.
#
# Auto: after CI succeeds on a push to main (workflow_run).
# Manual: workflow_dispatch (skips CI gate; can force image rebuild).
#
# Does NOT call open-sg.  CI stays on GitHub-hosted runners.
# See docs/operations/ec2-panel.md#self-hosted-runner for install / ops.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force image rebuild even if inputs are unchanged (1=yes)"
        default: "0"
        type: string

concurrency:
  group: ec2-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: [self-hosted, kuchup-prod]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.sha
                || github.event.workflow_run.head_sha }}

      - name: Deploy (on-box)
        env:
          # Run the deploy script locally — no SSH hairpin to the Elastic IP.
          # Credentials are read from REMOTE_DIR/aws-postgres.env and
          # REMOTE_DIR/.env which already exist on the server.
          DEPLOY_LOCAL: "1"
          REMOTE_DIR: /home/ec2-user/relocation-jobs
          # Skip expensive npm / Next.js static builds on the memory-constrained
          # t4g.micro runner.  Static assets (board.js, homepage) live in
          # REMOTE_DIR from the last laptop deploy and are bind-mounted into the
          # panel container — they do not need to be in the image.
          # Use a laptop deploy (./scripts/ec2_app_deploy.sh deploy) to push
          # updated frontend or homepage changes.
          SKIP_STATIC_BUILD: "1"
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || '0' }}
        run: ./scripts/ec2_app_deploy.sh deploy

      - name: Health check
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 https://kuchup.com/api/health)"
          echo "https://kuchup.com/api/health -> HTTP ${code}"
          test "${code}" = "200"
